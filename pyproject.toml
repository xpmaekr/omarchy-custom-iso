[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-custom-iso"
dynamic = ["version"]
description = "TUI builder for Omarchy ISOs with preinstalled AUR and repository apps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xpmaekr" }]
keywords = ["omarchy", "archlinux", "archiso", "aur", "iso", "textual"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
]
dependencies = ["textual>=0.80"]

[project.urls]
Homepage = "https://github.com/xpmaekr/omarchy-custom-iso"
Issues = "https://github.com/xpmaekr/omarchy-custom-iso/issues"
Changelog = "https://github.com/xpmaekr/omarchy-custom-iso/blob/main/CHANGELOG.md"

[project.scripts]
omarchy-custom-iso = "omarchy_custom_iso.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "omarchy_custom_iso.__version__" }

[tool.setuptools.packages.find]
include = ["omarchy_custom_iso*"]
